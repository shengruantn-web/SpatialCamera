name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # numpy runs the worker's SPZ encoder in tests/spz-roundtrip.test.mjs (decoded by Spark); without it
      # that test skips, so CI installs it rather than silently dropping the cross-implementation check.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy Pillow
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install worker test dependencies
        run: python -m pip install numpy Pillow
      - name: Byte-compile worker sources
        run: python -m py_compile gpu-worker/*.py
      - name: Run worker unit tests
        run: python -m unittest discover -s gpu-worker/tests -v
